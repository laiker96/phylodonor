name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    # Runs independently of the tests: nothing else matters if material that
    # should not be public has reached the tree or the history.
    #
    # The generic scan always runs and must pass. The project-pattern scan
    # needs the PRIVATE_PATTERNS secret, which is absent on forks and on pull
    # requests from them, so its absence is reported as a warning rather than
    # a failure -- a permanently red CI teaches people to ignore CI, which is
    # worse for safety than a visible gap. Hard enforcement lives in the
    # pre-commit hook, which reads the local .private-patterns file.
    runs-on: ubuntu-latest
    # Set at job level so that step-level `if:` can read it. A step's own
    # `env:` block is not visible to that step's `if:`.
    env:
      PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan working tree
        run: python tools/check_denylist.py --all

      - name: Scan full history
        if: env.PRIVATE_PATTERNS != ''
        run: python tools/check_history.py

      - name: Warn if project patterns are not configured
        if: env.PRIVATE_PATTERNS == ''
        run: |
          echo "::warning title=Project patterns not configured::PRIVATE_PATTERNS is unset, so only the generic patterns were checked and the git history was not scanned. Set it under Settings -> Secrets and variables -> Actions to enable the full check. Expected on forks."

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The dynamics extra brings OpenMM, so the minimisation tests run here
      # rather than being skipped. An optional dependency is not a reason to
      # leave code untested.
      - run: pip install -e ".[dev,dynamics]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
