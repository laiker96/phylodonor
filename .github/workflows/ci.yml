name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The dynamics extra brings OpenMM, so the minimisation tests run here
      # rather than being skipped. An optional dependency is not a reason to
      # leave code untested.
      - run: pip install -e ".[dev,dynamics]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
